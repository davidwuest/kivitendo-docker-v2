<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /opt/kivitendo-erp

    AliasMatch ^/[^/]+\.pl /opt/kivitendo-erp/dispatcher.fcgi
    Alias /kivitendo-erp/ /opt/kivitendo-erp/
    FcgidMaxRequestLen 10485760
    # Creating a client dataset runs ~200 DB migrations; over network latency to
    # a remote DB (e.g. Neon) that can exceed mod_fcgid's default 5-min limit and
    # get killed mid-migration. Give long admin requests plenty of headroom.
    FcgidBusyTimeout 1800
    FcgidIOTimeout   1800
    # Neon scale-to-zero: reap idle FCGI workers well before Neon suspends its
    # compute (default 300s). This keeps the invariant that any surviving worker
    # has been active recently enough that its cached DB connection is still
    # live; a returning user after a long idle gets a fresh worker that
    # cold-starts cleanly via the connect_timeout+retry in SL::DBConnect.
    FcgidIdleTimeout 120
    <Directory /opt/kivitendo-erp>
        AllowOverride All
        Options ExecCGI Includes FollowSymlinks
        Require all granted
    </Directory>

    <DirectoryMatch /path/to/kivitendo-erp/users>
        Require all denied
    </DirectoryMatch>

    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined
</VirtualHost>