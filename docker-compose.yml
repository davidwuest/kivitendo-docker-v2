services:
  # Local PostgreSQL — opt-in only. Neon is the default DB provider.
  # Start it with:  docker compose --profile local-db up
  db:
    image: postgres:13
    container_name: kivitendo-db
    profiles: ["local-db"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kivitendo
      POSTGRES_PASSWORD: kivitendo
      POSTGRES_DB: kivitendo
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - kivitendo-net

  app:
    build: .
    container_name: kivitendo-erp
    ports:
      - "82:80"
    # Neon connection + credentials (gitignored). The entrypoint renders the
    # [authentication/database] section of kivitendo.conf from these vars,
    # and PGSSLMODE is read by libpq for every connection.
    env_file:
      - dev/neon.env
    volumes:
      - webdav:/opt/kivitendo-erp/webdav
      - ./druckvorlagen:/opt/kivitendo-erp/templates/cvs
    networks:
      - kivitendo-net
    # Uncomment the following if you want the container to restart automatically
    # restart: always

volumes:
  db_data:
  webdav:

networks:
  kivitendo-net:
    driver: bridge
