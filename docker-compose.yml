services:
  # Local PostgreSQL. Runs only when DB_BACKEND=postgres, because
  # COMPOSE_PROFILES is set to ${DB_BACKEND} in .env and this service carries
  # the "postgres" profile. For DB_BACKEND=neon-postgres it stays stopped.
  db:
    image: postgres:13
    container_name: kivitendo-db
    profiles: ["postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-kivitendo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kivitendo}
      POSTGRES_DB: ${DB_NAME:-kivitendo}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - kivitendo-net

  app:
    build: .
    container_name: kivitendo-erp
    ports:
      - "82:80"
    # The database backend and connection come from ./.env (see .env.*.example).
    # The entrypoint applies local defaults when DB_BACKEND=postgres and renders
    # kivitendo.conf from these values.
    environment:
      DB_BACKEND: ${DB_BACKEND:-postgres}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - webdav:/opt/kivitendo-erp/webdav
      - ./druckvorlagen:/opt/kivitendo-erp/templates/cvs
    networks:
      - kivitendo-net
    # Uncomment the following if you want the container to restart automatically
    # restart: always

volumes:
  db_data:
  webdav:

networks:
  kivitendo-net:
    driver: bridge
